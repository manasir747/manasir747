<svg width="430" height="200" viewBox="0 0 430 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .lang-name { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #e1e4e8; }
      .header { fill: #0969da; }
      .lang-name { fill: #24292f; }
      .lang-pct { fill: #57606a; }
    }
  </style>

  <rect width="428" height="198" x="1" y="1" class="bg"/>

  <!-- Header -->
  <g transform="translate(25, 32)">
    <text class="header">Most Used Languages</text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(25, 48)">
    <mask id="bar-mask">
      <rect x="0" y="0" width="380" height="8" rx="4" fill="white"/>
    </mask>
    <g mask="url(#bar-mask)">
      <rect x="0.0" y="0" width="139.8" height="8" fill="#f1e05a"/><rect x="139.8" y="0" width="92.0" height="8" fill="#f34b7d"/><rect x="231.8" y="0" width="70.3" height="8" fill="#3572A5"/><rect x="302.1" y="0" width="39.5" height="8" fill="#e34c26"/><rect x="341.6" y="0" width="23.9" height="8" fill="#555555"/><rect x="365.6" y="0" width="14.4" height="8" fill="#b07219"/>
    </g>
  </g>

  <!-- Languages Grid -->
  <g transform="translate(25, 78)">
    
        <g transform="translate(0, 0)">
          <circle cx="5" cy="5" r="5" fill="#f1e05a"/>
          <text x="16" y="9" class="lang-name">JavaScript</text>
          <text x="180" y="9" class="lang-pct" text-anchor="end">36.8%</text>
        </g>
        
        <g transform="translate(200, 0)">
          <circle cx="5" cy="5" r="5" fill="#f34b7d"/>
          <text x="16" y="9" class="lang-name">C++</text>
          <text x="180" y="9" class="lang-pct" text-anchor="end">24.2%</text>
        </g>
        
        <g transform="translate(0, 26)">
          <circle cx="5" cy="5" r="5" fill="#3572A5"/>
          <text x="16" y="9" class="lang-name">Python</text>
          <text x="180" y="9" class="lang-pct" text-anchor="end">18.5%</text>
        </g>
        
        <g transform="translate(200, 26)">
          <circle cx="5" cy="5" r="5" fill="#e34c26"/>
          <text x="16" y="9" class="lang-name">HTML/CSS</text>
          <text x="180" y="9" class="lang-pct" text-anchor="end">10.4%</text>
        </g>
        
        <g transform="translate(0, 52)">
          <circle cx="5" cy="5" r="5" fill="#555555"/>
          <text x="16" y="9" class="lang-name">C</text>
          <text x="180" y="9" class="lang-pct" text-anchor="end">6.3%</text>
        </g>
        
        <g transform="translate(200, 52)">
          <circle cx="5" cy="5" r="5" fill="#b07219"/>
          <text x="16" y="9" class="lang-name">Java</text>
          <text x="180" y="9" class="lang-pct" text-anchor="end">3.8%</text>
        </g>
        
  </g>
</svg>